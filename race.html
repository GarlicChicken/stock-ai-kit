<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stock-ai-kit</title>
<style>
  :root {
    --bg: #222222; --panel: #2b2b2b; --line: #3d3d3d; --text: #efefef; --dim: #9a9a9a;
    --accent: #84ff4a; --down: #ff6b6b; --row: 66px;
    font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { display: flex; flex-direction: column; padding: 22px 28px 18px; gap: 14px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  .sub { color: var(--dim); font-size: 14px; margin-top: 6px; }
  .today { text-align: right; }
  .today .date { font-size: 32px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .today .day { color: var(--dim); font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  main { flex: 1; display: flex; gap: 16px; min-height: 0; }
  .chart { flex: 1; position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-height: 320px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  aside { width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; overflow: auto; }
  aside h2 { margin: 2px 0 10px; font-size: 14px; color: var(--dim); font-weight: 600; display: flex; justify-content: space-between; }
  #board { position: relative; }
  .row { position: absolute; left: 0; right: 0; height: calc(var(--row) - 6px); padding: 8px 10px 0; border-radius: 10px;
         transition: transform .33s cubic-bezier(.2,.8,.2,1), background-color .4s; display: grid;
         grid-template-columns: 30px 1fr auto; grid-template-rows: auto auto; column-gap: 8px; }
  .row .rank { grid-row: 1 / span 2; font-size: 22px; font-weight: 800; color: var(--dim); align-self: center; text-align: center; font-variant-numeric: tabular-nums; }
  .row.first .rank { color: var(--accent); }
  .row .nm { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 16px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .lb { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .amt { font-weight: 800; font-size: 17px; text-align: right; font-variant-numeric: tabular-nums; }
  .row .pc { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .row .bar { position: absolute; left: 48px; right: 10px; bottom: 6px; height: 4px; background: #343434; border-radius: 3px; overflow: hidden; }
  .row .bar i { display: block; height: 100%; border-radius: 3px; transition: width .2s linear; }
  .badge { font-size: 11px; font-weight: 800; padding: 1px 5px; border-radius: 6px; margin-left: 4px; }
  .badge.up { color: #1a1a1a; background: var(--accent); }
  .badge.down { color: #fff; background: var(--down); }
  .row.flash-up { background: rgba(132, 255, 74, .16); }
  .row.flash-down { background: rgba(255, 107, 107, .14); }
  .row.first { box-shadow: inset 0 0 0 1px rgba(132, 255, 74, .45); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .warn { color: #ffd84a; font-size: 11px; margin-left: 4px; }
  .bench { margin-top: 10px; border-top: 1px solid #333; padding-top: 8px; }
  .bench div { display: flex; justify-content: space-between; color: var(--dim); font-size: 13px; padding: 3px 4px; font-variant-numeric: tabular-nums; }
  .up { color: var(--accent); } .down { color: var(--down); }
  footer { display: flex; align-items: center; gap: 10px; }
  button, select { background: #333; color: var(--text); border: 1px solid #4a4a4a; border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 700; min-width: 92px; }
  button.on { background: #4a4a4a; border-color: #777; font-weight: 700; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  input[type=date] { background: #333; color: var(--text); border: 1px solid #4a4a4a; border-radius: 8px; padding: 7px 8px; font: inherit; font-size: 13px; color-scheme: dark; }
  .period { color: var(--dim); font-size: 13px; white-space: nowrap; }
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .metric .k { color: var(--dim); font-size: 12px; }
  .metric .v { font-size: 20px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid #333; }
  th:nth-child(-n+3), td:nth-child(-n+3) { text-align: left; }
  th { color: var(--dim); font-weight: 600; }
  .report main { min-height: 380px; }
  .report aside { width: 300px; }
  .hidden { display: none !important; }
  #final { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(18, 18, 18, .9); z-index: 4; }
  #final .box { width: min(1240px, 94vw); max-height: 90vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px 28px; }
  #final .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  #final h2 { margin: 0; font-size: 28px; font-weight: 800; }
  #final .cols { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; margin-top: 18px; }
  #final .cols.one { grid-template-columns: 1fr; }
  #final h3 { margin: 0 0 8px; font-size: 15px; color: var(--accent); }
  #final td, #final th { padding: 7px 8px; }
  #final .l { text-align: left !important; }
  #final .rk { font-weight: 800; color: var(--dim); }
  #final tr.win td { background: rgba(132, 255, 74, .1); }
  #final tr.win .rk { color: var(--accent); }
  #final .mem { color: var(--dim); font-size: 12px; }
  #drop { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 5; }
  #drop .box { width: min(720px, 90vw); border: 2px dashed #555; border-radius: 18px; padding: 48px 40px; text-align: center; }
  #drop.over .box { border-color: var(--accent); background: rgba(132, 255, 74, .06); }
  #drop h1 { font-size: 30px; margin-bottom: 10px; }
  #drop p { color: var(--dim); line-height: 1.7; margin: 6px 0; }
  #drop .pick { margin-top: 18px; }
  #drop .msg { margin-top: 18px; text-align: left; font-size: 13px; line-height: 1.6; }
  #drop .msg .bad { color: var(--down); }
</style>
</head>
<body>
<div id="drop" class="hidden"><div class="box">
  <h1>수익 레이스</h1>
  <p>멤버들에게 받은 <b>결과 CSV 파일</b>을 여기에 끌어다 놓으세요. 여러 개를 한 번에 놓아도 됩니다.</p>
  <p>팀 이름이 들어 있으면 <b>[팀]</b> 보기로 팀원 평균을 비교할 수 있고, 아래쪽 날짜로 기간을 바꿀 수 있습니다.</p>
  <p>코스피 · 코스닥 비교선을 넣으려면 키트의 <b>data/index.csv</b>도 함께 놓으세요.</p>
  <div class="pick"><button class="primary" id="pickBtn">파일 선택</button>
  <input type="file" id="pick" accept=".csv" multiple hidden></div>
  <div class="msg" id="dropMsg"></div>
</div></div>
<div id="final" class="hidden"><div class="box">
  <div class="top"><div><h2>최종 결과</h2><div class="sub" id="finalSub"></div></div><button id="finalClose">닫기</button></div>
  <div class="cols" id="finalCols">
    <section><h3>개인 순위</h3><table id="finalPerson"></table></section>
    <section id="finalTeamBox"><h3>팀 순위 (팀원 평균)</h3><table id="finalTeam"></table></section>
  </div>
</div></div>
<header>
  <div>
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="today">
    <div class="date" id="date"></div>
    <div class="day" id="day"></div>
  </div>
</header>
<section class="metrics hidden" id="metrics"></section>
<main>
  <div class="chart"><canvas id="cv"></canvas></div>
  <aside><h2><span id="boardTitle">순위</span><span id="boardSub"></span></h2><div id="board"></div><div class="bench" id="bench"></div></aside>
</main>
<footer id="controls" class="hidden">
  <button class="primary" id="play">재생</button>
  <button id="reset">처음으로</button>
  <select id="speed" aria-label="속도">
    <option value="12">속도 느리게</option>
    <option value="30" selected>속도 보통</option>
    <option value="80">속도 빠르게</option>
    <option value="250">속도 아주 빠르게</option>
  </select>
  <button id="modeAmt" class="on">평가금액</button>
  <button id="modePct">수익률</button>
  <span id="viewBox" class="hidden"><button id="viewPerson" class="on">개인</button> <button id="viewTeam">팀</button></span>
  <button id="finalBtn">최종 결과</button>
  <span class="period" title="기간을 바꾸면 그 첫날을 같은 출발선으로 다시 맞춥니다"><input type="date" id="from" aria-label="시작일"> ~ <input type="date" id="to" aria-label="끝 날짜"></span>
  <button id="again" class="hidden">파일 다시 선택</button>
  <input type="range" id="seek" min="0" max="0" value="0" step="0.01" aria-label="날짜 이동">
</footer>
<section id="tradesBox" class="hidden">
  <h2 style="font-size:14px;color:var(--dim);font-weight:600;margin:8px 0">최근 거래 30건</h2>
  <table><thead><tr><th>날짜</th><th>종목</th><th>구분</th><th>수량</th><th>가격</th><th>금액</th></tr></thead><tbody id="trades"></tbody></table>
</section>
<script>
let DATA = /*__DATA__*/null;
const COLORS = ["#84FF4A", "#4AC8FF", "#FF6B6B", "#FFD84A", "#C38BFF", "#FF9F4A", "#4AFFD1", "#FF7AC6",
                "#A3E635", "#60A5FA", "#F472B6", "#FBBF24", "#34D399", "#F87171", "#A78BFA", "#22D3EE"];
const BENCH = ["#9A9A9A", "#6F6F6F"];
const $ = (id) => document.getElementById(id);
let N = 0, init = 100000000, race = true, lines = [], benches = [];
let mode = "amt", frame = 0, playing = false, last = 0, yMin = 0, yMax = 1, ready = false, started = false;

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtPct = (r) => (r >= 0 ? "+" : "") + (r * 100).toFixed(1) + "%";
const fmtWon = (v) => Math.round(v).toLocaleString("ko-KR") + "원";
const fmtMan = (v) => {  // 1억 이상은 '억', 그 아래는 '만'
  if (Math.abs(v) >= 1e8) return (v / 1e8).toFixed(2).replace(/\.(\d*?)0+$/, (m, d) => d ? "." + d : "") + "억";
  const m = v / 10000; return (Math.abs(m) >= 100 ? Math.round(m).toLocaleString("ko-KR") : m.toFixed(1)) + "만";
};
const metric = (v) => mode === "amt" ? v : v / init - 1;
const axisLabel = (x) => mode === "amt" ? fmtMan(x) : (x * 100).toFixed(0) + "%";

function at(arr, f) {  // 날짜 사이를 이어서 값이 부드럽게 바뀌게
  const i = Math.floor(f), t = f - i, a = arr[Math.min(i, arr.length - 1)], b = arr[Math.min(i + 1, arr.length - 1)];
  if (a == null) return null;
  if (b == null || t === 0) return a;
  return a + (b - a) * t;
}


function targetRange(upto) {
  let lo = Infinity, hi = -Infinity;
  const end = Math.min(N - 1, Math.ceil(upto));
  for (const l of [...lines, ...benches]) for (let i = 0; i <= end; i++) {
    const v = l.values[i]; if (v == null) continue;
    const m = metric(v); if (m < lo) lo = m; if (m > hi) hi = m;
  }
  const base = metric(init); lo = Math.min(lo, base); hi = Math.max(hi, base);
  const pad = Math.max(mode === "amt" ? init * 0.03 : 0.03, (hi - lo) * 0.12);
  return [lo - pad, hi + pad];
}

function niceStep(span) {
  const raw = span / 6, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
  return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p;
}

function draw() {
  const cv = $("cv"), box = cv.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = box.width * dpr; cv.height = box.height * dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = box.width, H = box.height, L = 70, R = race ? 170 : 24, T = 18, B = 34;
  const x = (i) => L + (W - L - R) * (N <= 1 ? 0 : i / (N - 1));
  const y = (m) => T + (H - T - B) * (1 - (m - yMin) / (yMax - yMin));
  g.font = "12px Pretendard, 'Malgun Gothic', sans-serif";
  const step = niceStep(yMax - yMin), base = metric(init);
  g.textAlign = "right"; g.textBaseline = "middle";
  for (let v = Math.ceil(yMin / step) * step; v <= yMax; v += step) {
    const yy = y(v);
    g.strokeStyle = "#333"; g.lineWidth = 1; g.beginPath(); g.moveTo(L, yy); g.lineTo(W - R, yy); g.stroke();
    g.fillStyle = "#8a8a8a"; g.fillText(axisLabel(v), L - 8, yy);
  }
  g.strokeStyle = "#5a5a5a"; g.beginPath(); g.moveTo(L, y(base)); g.lineTo(W - R, y(base)); g.stroke();
  g.textAlign = "center"; g.textBaseline = "top";
  const months = N / 21, stepM = months > 40 ? 12 : months > 24 ? 3 : months > 10 ? 2 : 1;
  let prevKey = "";
  for (let i = 0; i < N; i++) {
    const d = DATA.dates[i], key = d.slice(0, 7);
    if (key === prevKey) continue; prevKey = key;
    if ((Number(d.slice(5, 7)) - 1) % stepM !== 0) continue;
    const xx = x(i);
    g.strokeStyle = "#2f2f2f"; g.beginPath(); g.moveTo(xx, T); g.lineTo(xx, H - B); g.stroke();
    g.fillStyle = "#8a8a8a"; g.fillText(stepM === 12 ? d.slice(0, 4) : d.slice(2, 7).replace("-", "."), xx, H - B + 8);
  }
  const path = (l, width, dash) => {
    g.strokeStyle = l.color; g.lineWidth = width; g.setLineDash(dash || []); g.beginPath();
    let started = false; const end = Math.floor(frame);
    for (let i = 0; i <= end; i++) {
      const v = l.values[i]; if (v == null) { started = false; continue; }
      if (!started) { g.moveTo(x(i), y(metric(v))); started = true; } else g.lineTo(x(i), y(metric(v)));
    }
    const hv = at(l.values, frame);
    if (started && hv != null && frame > end) g.lineTo(x(frame), y(metric(hv)));
    g.stroke(); g.setLineDash([]);
  };
  benches.forEach(b => path(b, 1.5, [5, 4]));
  lines.forEach(l => path(l, lines.length > 8 ? 2 : 2.8));
  if (race || lines.length > 1) {  // 선 끝 이름표 (겹치지 않게)
    const heads = [...lines, ...benches].map(l => ({ l, v: at(l.values, frame) })).filter(h => h.v != null)
      .map(h => ({ ...h, yy: y(metric(h.v)), y0: y(metric(h.v)) })).sort((a, b) => a.yy - b.yy);
    for (let k = 1; k < heads.length; k++) if (heads[k].yy - heads[k - 1].yy < 17) heads[k].yy = heads[k - 1].yy + 17;
    g.textAlign = "left"; g.textBaseline = "middle";
    for (const h of heads) {
      g.fillStyle = h.l.color; g.beginPath(); g.arc(x(frame), h.y0, 4.5, 0, Math.PI * 2); g.fill();
      g.font = "bold 13px Pretendard, 'Malgun Gothic', sans-serif";
      g.fillText(h.l.name + "  " + (mode === "amt" ? fmtMan(h.v) + "원" : fmtPct(h.v / init - 1)), x(frame) + 10, h.yy);
    }
  }
}

// 순위표: 줄이 자리를 바꾸며 움직인다
const rows = new Map(), prevRank = new Map(), badgeUntil = new Map();
let order = [], orderAt = -1e9;
function buildBoard() {
  const board = $("board");
  board.style.height = `calc(var(--row) * ${lines.length})`;
  lines.forEach((l) => {
    const el = document.createElement("div");
    el.className = "row";
    el.innerHTML = `<div class="rank"></div>
      <div class="nm"><span class="dot" style="background:${l.color}"></span><span>${esc(l.name)}</span>${l.check === "다름" ? '<span class="warn">확인 필요</span>' : ""}<span class="bd"></span></div>
      <div class="amt"></div><div class="lb">${esc(l.label || "")}</div><div class="pc"></div>
      <div class="bar"><i style="background:${l.color}"></i></div>`;
    board.appendChild(el);
    rows.set(l, el);
  });
}

function board(now) {
  const i = Math.floor(frame);
  $("date").textContent = DATA.dates[i];
  $("day").textContent = race ? (frame >= N - 1 ? `최종 · ${N}거래일` : `${i + 1} / ${N}거래일`) : `${N}거래일`;
  // 숫자는 매 순간 바뀌고, 줄 자리는 0.35초마다 한 번씩만 바꾼다 (자주 바뀌면 줄이 겹쳐 읽기 어려움)
  const vals = new Map(lines.map(l => [l, at(l.values, frame)]));
  if (!playing || now - orderAt > 350 || order.length !== lines.length) {
    order = lines.filter(l => vals.get(l) != null).sort((a, b) => vals.get(b) - vals.get(a));
    orderAt = now;
  }
  const cur = order.map(l => ({ l, v: vals.get(l) })).filter(r => r.v != null);
  const maxV = Math.max(...cur.map(r => r.v), init);
  cur.forEach((r, k) => {
    const el = rows.get(r.l);
    el.style.transform = `translateY(calc(var(--row) * ${k}))`;
    el.classList.toggle("first", k === 0);
    el.querySelector(".rank").textContent = k + 1;
    el.querySelector(".amt").textContent = fmtWon(r.v);
    const pc = el.querySelector(".pc"), ret = r.v / init - 1;
    pc.textContent = fmtPct(ret); pc.className = "pc " + (ret >= 0 ? "up" : "down");
    el.querySelector(".bar i").style.width = (Math.max(0, r.v) / maxV * 100).toFixed(1) + "%";
    const before = prevRank.get(r.l);
    if (ready && before != null && before !== k) {
      badgeUntil.set(r.l, { until: now + 1600, up: k < before, n: Math.abs(before - k) });
    }
    prevRank.set(r.l, k);
    const b = badgeUntil.get(r.l), bd = el.querySelector(".bd");
    if (b && now < b.until) {
      bd.innerHTML = `<span class="badge ${b.up ? "up" : "down"}">${b.up ? "▲" : "▼"}${b.n}</span>`;
      el.classList.toggle("flash-up", b.up); el.classList.toggle("flash-down", !b.up);
    } else { bd.innerHTML = ""; el.classList.remove("flash-up", "flash-down"); }
  });
  ready = true;
  $("bench").innerHTML = benches.map(b => { const v = at(b.values, frame); return v == null ? "" :
    `<div><span>${esc(b.name)} (지수 비교)</span><span>${mode === "amt" ? fmtWon(v) : fmtPct(v / init - 1)}</span></div>`; }).join("");
  if (race) $("seek").value = frame;
}

function tick(t) {
  const dt = last ? Math.min(0.1, (t - last) / 1000) : 0; last = t;
  if (playing) {
    frame = Math.min(N - 1, frame + dt * Number($("speed").value));
    if (frame >= N - 1) {
      setPlaying(false);
      if (race && RAW && !finalShown) { finalShown = true; setTimeout(showFinal, 1200); }
    }
  }
  const [lo, hi] = targetRange(frame);
  const k = race ? 0.12 : 1;
  yMin += (lo - yMin) * k; yMax += (hi - yMax) * k;
  draw(); if (race) board(t); else staticBoard();
  requestAnimationFrame(tick);
}

function setPlaying(p) { playing = p; $("play").textContent = p ? "일시정지" : "재생"; }
function setMode(m) {
  mode = m; $("modeAmt").classList.toggle("on", m === "amt"); $("modePct").classList.toggle("on", m === "pct");
  const [lo, hi] = targetRange(frame); yMin = lo; yMax = hi;
}

function staticBoard() {
  const i = N - 1;
  $("date").textContent = DATA.dates[i];
  $("day").textContent = `${N}거래일`;
  const all = [...lines, ...benches].map(l => ({ l, v: l.values[i] })).filter(r => r.v != null);
  $("board").innerHTML = all.map(r => `<div style="display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #333">
    <span style="display:flex;gap:7px;align-items:center;font-weight:700"><span class="dot" style="background:${r.l.color}"></span>${esc(r.l.name)}</span>
    <span class="${r.v >= init ? "up" : "down"}" style="font-weight:800">${fmtPct(r.v / init - 1)}</span></div>`).join("");
}

function clearBoard() {
  $("board").innerHTML = ""; rows.clear(); prevRank.clear(); badgeUntil.clear(); order = []; ready = false;
}

function start(d) {
  DATA = d;
  N = DATA.dates.length; init = DATA.initial; race = DATA.mode === "race";
  lines = DATA.series.map((s, i) => ({ ...s, color: s.color || COLORS[i % COLORS.length] }));
  benches = (DATA.benchmarks || []).map((b, i) => ({ ...b, color: BENCH[i % BENCH.length] }));
  frame = race ? 0 : N - 1;
  $("title").textContent = DATA.title;
  $("subtitle").textContent = DATA.subtitle || "";
  document.title = DATA.title;
  if (!race) document.body.classList.add("report");
  if (race) {
    clearBoard(); buildBoard(); setPlaying(false);
    $("boardTitle").textContent = view === "team" ? "팀 순위" : "순위";
    $("boardSub").textContent = view === "team" ? "팀원 평균 · 평가금액 순" : "평가금액 순";
    $("controls").classList.remove("hidden");
    $("seek").max = N - 1; $("seek").value = 0;
    if (!bound) {
      bound = true;
      $("play").onclick = () => { if (frame >= N - 1) { frame = 0; finalShown = false; } setPlaying(!playing); };
      $("finalBtn").onclick = showFinal;
      $("finalClose").onclick = hideFinal;
      $("final").addEventListener("click", (e) => { if (e.target.id === "final") hideFinal(); });
      $("reset").onclick = () => { frame = 0; finalShown = false; setPlaying(false); };
      $("seek").oninput = (e) => { frame = Number(e.target.value); };
      $("modeAmt").onclick = () => setMode("amt");
      $("modePct").onclick = () => setMode("pct");
      $("viewPerson").onclick = () => setView("person");
      $("viewTeam").onclick = () => setView("team");
      $("from").onchange = $("to").onchange = () => setRange($("from").value, $("to").value);
      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" && e.target.type === "date") return;
        if (e.code === "Escape") { hideFinal(); return; }
        if (!$("final").classList.contains("hidden")) return;
        if (e.code === "Space") { e.preventDefault(); $("play").click(); }
        if (e.code === "ArrowRight") frame = Math.min(N - 1, Math.floor(frame) + 5);
        if (e.code === "ArrowLeft") frame = Math.max(0, Math.floor(frame) - 5);
      });
    }
  } else {
    $("boardTitle").textContent = "비교";
    const m = DATA.metrics || [];
    const show = (x) => {
      const v = x.value;
      if (v == null) return "-";
      if (x.key === "final_equity") return fmtWon(v);
      if (["total_return", "cagr", "mdd"].includes(x.key)) return fmtPct(v);
      if (x.key === "volatility") return (v * 100).toFixed(1) + "%";
      if (x.key === "sharpe") return v.toFixed(2);
      if (x.key === "turnover") return v.toFixed(1) + "배";
      return v.toLocaleString("ko-KR") + (x.key === "trades" ? "건" : "");
    };
    $("metrics").innerHTML = m.map(x => `<div class="metric"><div class="k">${x.label}</div><div class="v">${show(x)}</div></div>`).join("");
    $("metrics").classList.remove("hidden");
    if ((DATA.trades || []).length) {
      $("trades").innerHTML = DATA.trades.map(t => `<tr><td>${t[0]}</td><td>${esc(t[1])}</td><td>${t[2]}</td>
        <td>${Number(t[3]).toLocaleString("ko-KR")}</td><td>${Math.round(t[4]).toLocaleString("ko-KR")}</td><td>${Number(t[5]).toLocaleString("ko-KR")}</td></tr>`).join("");
      $("tradesBox").classList.remove("hidden");
      document.body.style.overflow = "auto";
    }
  }
  setMode(race ? mode : "pct");
  if (!started) { started = true; window.addEventListener("resize", draw); requestAnimationFrame(tick); }
}

// ---------------------------------------------------------------- 레이스 구성: 개인 · 팀 보기, 기간 고르기
// RAW: 원래 평가금액 그대로. 보기 · 기간을 바꿀 때마다 그 기간 첫날을 같은 출발선(시작 금액)으로 다시 맞춘다.
let RAW = null, view = "person", rLo = 0, rHi = 0, bound = false;

function rebaseSlice(values, base) {
  const part = values.slice(rLo, rHi + 1);
  const first = part.find(v => v != null);
  return first ? part.map(v => v == null ? null : v / first * base) : part;
}

function compose() {
  const dates = RAW.dates.slice(rLo, rHi + 1), base = RAW.initial;
  const people = RAW.series.map((s, i) => ({ ...s, color: COLORS[i % COLORS.length], values: rebaseSlice(s.values, base),
                                              label: s.team ? `${s.team} · ${s.label}` : s.label }));
  let series = people;
  if (view === "team") {
    const groups = new Map();
    for (const p of people) {
      const key = p.team ? p.team : `${p.name} (개인)`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    }
    series = [...groups.entries()].map(([team, ms], i) => ({
      name: team, label: ms.map(m => m.name).join(" · "), color: COLORS[i % COLORS.length],
      values: dates.map((_, k) => {
        const vs = ms.map(m => m.values[k]).filter(v => v != null);
        return vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : null;
      }),
    }));
  }
  const benchmarks = (RAW.benchmarks || []).map(b => ({ ...b, values: rebaseSlice(b.values, base) }));
  const unit = view === "team" ? `${series.length}팀 (${people.length}명)` : `${people.length}명`;
  return { mode: "race", title: RAW.title || "수익 레이스", initial: base, dates, series, benchmarks,
           subtitle: `${dates[0]} ~ ${dates[dates.length - 1]} · 시작 금액 ${Math.round(base).toLocaleString("ko-KR")}원 · ${unit}` };
}

function setView(v) {
  view = v;
  $("viewPerson").classList.toggle("on", v === "person"); $("viewTeam").classList.toggle("on", v === "team");
  const keep = frame, wasPlaying = playing;
  start(compose());
  frame = Math.min(keep, N - 1); $("seek").value = frame;
  if (wasPlaying) setPlaying(true);
}

// ---------------------------------------------------------------- 최종 결과 (개인 순위 + 팀 순위)
let finalShown = false;

function curveStat(values, base) {
  let peak = -Infinity, mdd = 0, last = null;
  for (const v of values) {
    if (v == null) continue;
    last = v; if (v > peak) peak = v;
    const dd = v / peak - 1; if (dd < mdd) mdd = dd;
  }
  return { final: last, ret: last == null ? null : last / base - 1, mdd };
}

function finalResults() {
  const base = RAW.initial, dates = RAW.dates.slice(rLo, rHi + 1);
  const people = RAW.series.map(s => ({ name: s.name, team: s.team || "", label: s.label || "", values: rebaseSlice(s.values, base) }));
  const P = people.map(p => ({ ...p, ...curveStat(p.values, base) })).filter(p => p.final != null).sort((a, b) => b.final - a.final);
  const groups = new Map();
  for (const p of people) if (p.team) { if (!groups.has(p.team)) groups.set(p.team, []); groups.get(p.team).push(p); }
  const T = [...groups.entries()].map(([team, ms]) => {
    const avg = dates.map((_, k) => { const vs = ms.map(m => m.values[k]).filter(v => v != null); return vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : null; });
    return { team, n: ms.length, members: ms.map(m => m.name).join(" · "), ...curveStat(avg, base) };
  }).filter(t => t.final != null).sort((a, b) => b.final - a.final);
  return { dates, P, T };
}

function showFinal() {
  if (!RAW) return;
  setPlaying(false);
  const { dates, P, T } = finalResults();
  $("finalSub").textContent = `${dates[0]} ~ ${dates[dates.length - 1]} · 시작 금액 ${fmtWon(RAW.initial)} · ${P.length}명` + (T.length ? ` · ${T.length}팀` : "");
  const cls = (r) => r >= 0 ? "up" : "down";
  $("finalPerson").innerHTML = `<thead><tr><th class="l">순위</th><th class="l">이름</th><th class="l">팀</th><th class="l">전략</th>
    <th>최종 평가금액</th><th>수익률</th><th>최대 낙폭</th></tr></thead><tbody>` + P.map((p, i) => `<tr class="${i === 0 ? "win" : ""}">
    <td class="l rk">${i + 1}</td><td class="l"><b>${esc(p.name)}</b></td><td class="l">${esc(p.team || "-")}</td><td class="l">${esc(p.label)}</td>
    <td>${fmtWon(p.final)}</td><td class="${cls(p.ret)}"><b>${fmtPct(p.ret)}</b></td><td>${fmtPct(p.mdd)}</td></tr>`).join("") + "</tbody>";
  $("finalTeamBox").classList.toggle("hidden", !T.length);
  $("finalCols").classList.toggle("one", !T.length);
  $("finalTeam").innerHTML = `<thead><tr><th class="l">순위</th><th class="l">팀</th><th>평균 평가금액</th><th>평균 수익률</th><th>최대 낙폭</th></tr></thead><tbody>` +
    T.map((t, i) => `<tr class="${i === 0 ? "win" : ""}"><td class="l rk">${i + 1}</td>
    <td class="l"><b>${esc(t.team)}</b><div class="mem">${esc(t.members)} (${t.n}명)</div></td>
    <td>${fmtWon(t.final)}</td><td class="${cls(t.ret)}"><b>${fmtPct(t.ret)}</b></td><td>${fmtPct(t.mdd)}</td></tr>`).join("") + "</tbody>";
  $("final").classList.remove("hidden");
}

function hideFinal() { $("final").classList.add("hidden"); }

function setRange(from, to) {
  const ds = RAW.dates;
  let lo = ds.findIndex(d => d >= from), hi = -1;
  for (let i = ds.length - 1; i >= 0; i--) if (ds[i] <= to) { hi = i; break; }
  if (lo < 0 || hi < 0 || hi - lo < 1) { $("from").value = ds[rLo]; $("to").value = ds[rHi]; return; }
  rLo = lo; rHi = hi; finalShown = false;
  $("from").value = ds[rLo]; $("to").value = ds[rHi];
  start(compose());
}

function openRace(raw) {
  RAW = raw; rLo = 0; rHi = RAW.dates.length - 1; view = "person"; finalShown = false;
  const hasTeam = RAW.series.some(s => s.team);
  $("viewBox").classList.toggle("hidden", !hasTeam);
  $("viewPerson").classList.add("on"); $("viewTeam").classList.remove("on");
  for (const id of ["from", "to"]) { $(id).min = RAW.dates[0]; $(id).max = RAW.dates[RAW.dates.length - 1]; }
  $("from").value = RAW.dates[0]; $("to").value = RAW.dates[RAW.dates.length - 1];
  start(compose());
}

// ---------------------------------------------------------------- CSV 끌어다 놓기 (race.html을 바로 열었을 때)
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim());
  return rows.filter(r => r.length > 1 || (r[0] || "").trim()).map(r => Object.fromEntries(head.map((h, k) => [h, (r[k] || "").trim()])));
}

function buildFromFiles(files) {
  const series = [], benchRows = [], msgs = [];
  for (const f of files) {
    const rows = parseCSV(f.text);
    const cols = rows.length ? Object.keys(rows[0]) : [];
    if (["date", "name", "close"].every(c => cols.includes(c)) && !cols.includes("equity")) {
      benchRows.push(...rows); msgs.push(["ok", `${f.name}: 지수 비교선`]); continue;
    }
    const need = ["date", "name", "strategy", "equity"].filter(c => !cols.includes(c));
    if (need.length) { msgs.push(["bad", `${f.name}: 결과 CSV 양식이 아니라서 뺐습니다 (없는 열: ${need.join(", ")})`]); continue; }
    const map = new Map();
    let bad = false;
    for (const r of rows) {
      const v = Number(r.equity);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(r.date) || !isFinite(v)) { bad = true; break; }
      map.set(r.date, v);
    }
    if (bad || map.size < 2) { msgs.push(["bad", `${f.name}: 날짜(YYYY-MM-DD)나 평가금액이 잘못된 줄이 있어 뺐습니다`]); continue; }
    const dates = [...map.keys()].sort(), team = (rows[0].team || "").trim();
    series.push({ name: rows[0].name || f.name, label: rows[0].strategy || "", team, map, first: dates[0], last: dates[dates.length - 1], start: map.get(dates[0]) });
    msgs.push(["ok", `${f.name}: ${rows[0].name}${team ? " [" + team + "]" : ""} · ${rows[0].strategy} (${dates[0]} ~ ${dates[dates.length - 1]})`]);
  }
  if (!series.length) return { msgs };
  const lo = series.map(s => s.first).sort().pop(), hi = series.map(s => s.last).sort()[0];
  if (lo >= hi) { msgs.push(["bad", "파일들의 기간이 겹치지 않습니다."]); return { msgs }; }
  const cut = series.some(s => s.first !== lo || s.last !== hi);
  const dates = [...new Set(series.flatMap(s => [...s.map.keys()]))].filter(d => d >= lo && d <= hi).sort();
  const fill = (map) => { let prev = null; return dates.map(d => { if (map.has(d)) prev = map.get(d); return prev; }); };
  // 시작 금액: 각 CSV 첫 줄(원래 시작일)의 평가금액 중 가장 많은 값 (보통 모두 1억 원)
  const count = new Map();
  for (const s of series) { const k = Math.round(s.start); count.set(k, (count.get(k) || 0) + 1); }
  const initial = [...count.entries()].sort((a, b) => b[1] - a[1] || b[0] - a[0])[0][0];
  const won = initial.toLocaleString("ko-KR") + "원";
  if (cut) msgs.push(["ok", `기간이 서로 달라 겹치는 기간(${lo} ~ ${hi})으로 맞추고, ${lo}에 모두 ${won}에서 다시 출발하게 했습니다 (수익률 흐름은 그대로).`]);
  else if (count.size > 1) msgs.push(["ok", `시작 금액이 서로 달라 모두 ${won}에서 출발하도록 맞췄습니다 (수익률 흐름은 그대로).`]);
  const seen = {};
  const out = series.map(s => {
    seen[s.name] = (seen[s.name] || 0) + 1;
    return { name: seen[s.name] > 1 ? `${s.name} (${seen[s.name]})` : s.name, label: s.label, team: s.team, values: fill(s.map) };
  });
  const benchmarks = [];
  for (const nm of [...new Set(benchRows.map(r => r.name))].sort((a, b) => (a === "KOSPI" ? -1 : b === "KOSPI" ? 1 : 0))) {
    benchmarks.push({ name: nm === "KOSPI" ? "코스피" : nm === "KOSDAQ" ? "코스닥" : nm,
                      values: fill(new Map(benchRows.filter(r => r.name === nm).map(r => [r.date, Number(r.close)]))) });
  }
  return { msgs, raw: { title: "수익 레이스", initial, dates, series: out, benchmarks } };
}

function openFiles(list) {
  const files = [...list].filter(f => /\.csv$/i.test(f.name));
  Promise.all(files.map(f => f.text().then(text => ({ name: f.name, text })))).then(read => {
    const { msgs, raw } = buildFromFiles(read);
    $("dropMsg").innerHTML = msgs.map(([k, m]) => `<div class="${k === "bad" ? "bad" : ""}">${esc(m)}</div>`).join("");
    if (raw) { $("drop").classList.add("hidden"); $("again").classList.remove("hidden"); openRace(raw); }
  });
}

if (DATA && DATA.mode === "race") openRace({ title: DATA.title, initial: DATA.initial, dates: DATA.dates,
                                              series: DATA.series, benchmarks: DATA.benchmarks || [] });
else if (DATA) start(DATA);
else {
  const drop = $("drop");
  drop.classList.remove("hidden");
  $("pickBtn").onclick = () => $("pick").click();
  $("pick").onchange = (e) => openFiles(e.target.files);
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); openFiles(e.dataTransfer.files); });
}
$("again").onclick = () => location.reload();
</script>
</body>
</html>
