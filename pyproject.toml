[project]
name = "stock-ai-kit"
version = "0.5.0"
description = "AI와 함께 하는 국내 주식 연구 키트 (일봉 데이터, 백테스트, 결과 비교)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "finance-datareader>=0.9.202",
    "pykrx>=1.2.9",
    "yfinance>=1.8.0",
    "pyarrow>=18.0",
    "requests>=2.31",
]

[project.scripts]
kit = "kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kit"]

[tool.uv]
# 모두 같은 파이썬을 쓰도록 uv가 받은 파이썬만 사용한다
python-preference = "only-managed"
