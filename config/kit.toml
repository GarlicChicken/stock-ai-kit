# 키트 공통 설정
# 모두가 같은 조건에서 결과를 비교하려면 이 파일은 고치지 않습니다.

[data]
# 원천: 한국거래소 전 종목 일별 데이터 (FinanceData/marcap, 상장폐지 종목 포함)
top_n = 200                    # 매달 마지막 거래일의 시가총액 상위 몇 종목을 다음 달 투자 대상으로 할지
                               # (보통주만, 스팩·우선주 제외)
adjust_anchor = "2024-12-31"   # 수정주가 기준일: 이 날 이전 마지막 거래일의 수정주가 = 실제 가격

[period]
data_start = "2000-01-01"      # 데이터 시작일
research_end = "2024-12-31"    # 연구 기간 끝 (참가자에게 나눠 주는 데이터의 끝)
compare_start = "2025-01-02"   # 레이스(제출) 기간 기본값 시작. 실제 기간은 진행자가 정해 --start로 알려 줌
compare_end = "2026-10-30"     # 레이스(제출) 기간 기본값 끝

[account]
initial_cash = 10000000        # 시작 금액 (원)
cash_buffer = 0.002            # 수수료·세금 여유분으로 남겨 두는 현금 비율 (0.2%)

[cost]
commission = 0.00015           # 매매 수수료 (살 때·팔 때 각각 0.015%)
slippage = 0.0                 # 체결 가격 보정 (0.001 = 0.1% 불리하게 체결)

# 증권거래세 (팔 때만, 농어촌특별세 포함). 적힌 날짜부터 적용.
[cost.sell_tax.KOSPI]
